<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Dark Luxury Contrast Badge -->
  <rect width="100" height="100" rx="22" fill="#0A0A0A" />
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5" />

  <!-- Center Axis Bar -->
  <rect x="10" y="48.5" width="80" height="3" rx="1.5" fill="#E5B83B" opacity="0.8" />

  <!-- Left Dumbbell Plates (Gold) -->
  <rect x="14" y="37" width="4.5" height="26" rx="2.25" fill="#D4AF37" />
  <rect x="20.5" y="30" width="5.5" height="40" rx="2.75" fill="#E5B83B" />
  <rect x="28" y="21" width="6.5" height="58" rx="3.25" fill="#FFDF73" />

  <!-- Right Dumbbell Plates (Gold) -->
  <rect x="65.5" y="21" width="6.5" height="58" rx="3.25" fill="#FFDF73" />
  <rect x="74" y="30" width="5.5" height="40" rx="2.75" fill="#E5B83B" />
  <rect x="81.5" y="37" width="4.5" height="26" rx="2.25" fill="#D4AF37" />

  <!-- Left Stylized Monogram (White) -->
  <path d="M 37.5 31 L 46 22.5 L 46 69.5 L 37.5 77.5 Z" fill="#FFFFFF" />
  <path d="M 37 50 L 46 50" stroke="#FFFFFF" stroke-width="3.5" />

  <!-- Center Heartbeat / EKG Pulse (Gold) -->
  <path d="M 45 50 L 48 50 L 49.5 38 L 51.5 62 L 53.5 44 L 55 50 L 58 50" fill="none" stroke="#FFDF73" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Stylized Monogram (Gold) -->
  <path d="M 62.5 31 L 54 22.5 L 54 69.5 L 62.5 77.5 Z" fill="#D4AF37" />
  <path d="M 54 22.5 L 62.5 22.5" stroke="#FFDF73" stroke-width="3.5" />

  <!-- HI-TECH Text -->
  <text x="50" y="90" font-family="'Ysabeau Office', 'Arial Black', sans-serif" font-weight="900" font-size="10.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    HI<tspan fill="#FFDF73">TECH</tspan>
  </text>
</svg>